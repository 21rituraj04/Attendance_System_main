<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AttendX – Smart Attendance Management System for colleges and universities. Track, manage, and analyze attendance with QR and PIN-based verification." />
    <title>AttendX – Smart Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- High-Performance CSS Preloader -->
      <style>
        .preloader {
          position: fixed;
          inset: 0;
          background: #060b18;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .preloader-logo {
          position: relative;
          width: 80px;
          height: 80px;
          background: rgba(59, 130, 246, 0.1);
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid rgba(59, 130, 246, 0.2);
          box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
          animation: preloader-pulse 2s infinite ease-in-out;
        }
        .preloader-icon {
          width: 32px;
          height: 32px;
          border: 3px solid #3b82f6;
          border-top-color: transparent;
          border-radius: 50%;
          animation: preloader-spin 1s infinite linear;
        }
        .preloader-text {
          margin-top: 24px;
          font-size: 13px;
          font-weight: 600;
          color: #94a3b8;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          animation: preloader-fade 2s infinite ease-in-out;
        }
        @keyframes preloader-pulse {
          0%, 100% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 50px rgba(59, 130, 246, 0.2); }
        }
        @keyframes preloader-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes preloader-fade {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }
      </style>
      <div class="preloader">
        <div class="preloader-logo">
          <div class="preloader-icon"></div>
        </div>
        <div class="preloader-text">Loading AttendX ERP</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
